<!doctype html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'; connect-src 'none'"><title>Thiết lập Photobooth</title>
<style>body{font:17px system-ui,sans-serif;background:#f5f3ef;color:#272622;margin:0}main{max-width:800px;margin:40px auto;padding:32px;background:white;border-radius:20px;box-shadow:0 10px 40px #0001}h1{margin-top:0}p{line-height:1.6}form{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:grid;gap:7px}input,select,button{font:inherit;padding:12px;border:1px solid #ccc;border-radius:8px;min-width:0}button{background:#304e46;color:white;cursor:pointer}.wide{grid-column:1/-1}small{color:#57574f}#status{white-space:pre-wrap}button:disabled{opacity:.5}</style></head>
<body><main><h1>Photobooth trên Windows</h1><p>Kết nối Canon R10 bằng USB, mở digiCamControl và bật <b>Webserver / Allow interaction</b>. Máy in trong phiên bản này là <b>mô phỏng</b>.</p>
<form id="setup"><label>Camera<select name="cameraMode"><option value="digicamcontrol">Canon R10 qua digiCamControl</option><option value="mock">Ảnh mô phỏng để thử app</option></select></label><label>IP LAN của laptop<input name="lanIp" list="ips" placeholder="192.168.1.50" required><datalist id="ips"></datalist></label>
<label>Serial R10 (để trống nếu chỉ một camera)<input name="cameraId" autocomplete="off"></label><label>Cổng digiCamControl<input name="dccPort" type="number" min="1024" max="65535" value="5513" required></label>
<label>Cổng operator (chỉ máy này)<input name="operatorPort" type="number" value="8080" required></label><label>Cổng khách tải ảnh qua Wi-Fi<input name="guestPort" type="number" value="8081" required></label>
<label class="wide">Đường dẫn LK Magic (tùy chọn)<input name="lkMagicExecutable" placeholder="D:\LK Magic-WIN\LK magic.exe"></label>
<label class="wide">Đường dẫn digiCamControl.exe<input name="dccExecutable" placeholder="C:\Program Files (x86)\digiCamControl\CameraControl.exe"></label>
<label>Tài khoản Admin cho lần chạy đầu<input name="username" autocomplete="username" placeholder="admin"></label><label>Mật khẩu Admin (ít nhất 12 ký tự)<input name="password" type="password" autocomplete="new-password"></label>
<small class="wide">Tài khoản đã có được giữ nguyên. Khách chỉ truy cập cổng tải ảnh. Cổng digiCamControl cần chặn từ LAN; không bật Allow public access.</small><button class="wide" id="launch" type="submit">Khởi động Photobooth</button></form><p id="status" role="status"></p></main><script src="setup.js"></script></body></html>
