# Guest LAN Listener (0.0.0.0:8081)
# Strictly serves /share/{token} and /share/{token}/download only.
# Blocks /custom/api, /api, /admin, and private directories.
Listen 0.0.0.0:8081

<VirtualHost *:8081>
    ServerName photobooth-share.local
    DocumentRoot /var/www/photobooth/custom/public

    SetEnv PHOTOBOOTH_LISTENER_MODE guest

    # Route existing public files through the same allowlist as virtual share URLs.
    RewriteEngine On
    RewriteRule ^/guest\.php$ - [END]
    RewriteRule ^ /guest.php [END]

    # Do not log query strings or share tokens in access logs
    LogFormat "%h %l %u %t \"%m /share/[REDACTED] %H\" %>s %b" guest_redacted
    CustomLog ${APACHE_LOG_DIR}/guest-access.log guest_redacted
    ErrorLog ${APACHE_LOG_DIR}/guest-error.log

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    Header always set Cache-Control "no-store"

    <Directory /var/www/photobooth/custom/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        FallbackResource /guest.php
    </Directory>

    <LocationMatch "^/(custom/api|api|admin|private|config|lib|src|vendor)">
        Require all denied
    </LocationMatch>
</VirtualHost>

