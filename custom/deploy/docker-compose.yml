services:
  operator-web:
    build:
      context: ../..
      dockerfile: custom/deploy/Dockerfile
    env_file:
      - ../.env
    environment:
      DATA_DIR: /var/lib/photobooth-operator
      DATABASE_PATH: /var/lib/photobooth-operator/db/photobooth.sqlite
      CAMERA_ADAPTER: mock
      PRINTER_ADAPTER: mock
    ports:
      - "127.0.0.1:8080:8080"
      - "8081:8081"
    volumes:
      - photobooth_operator_data:/var/lib/photobooth-operator
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  operator-worker:
    build:
      context: ../..
      dockerfile: custom/deploy/Dockerfile
    command: ["php", "/var/www/photobooth/custom/bin/worker.php"]
    env_file:
      - ../.env
    environment:
      DATA_DIR: /var/lib/photobooth-operator
      DATABASE_PATH: /var/lib/photobooth-operator/db/photobooth.sqlite
      CAMERA_ADAPTER: mock
      PRINTER_ADAPTER: mock
    volumes:
      - photobooth_operator_data:/var/lib/photobooth-operator
    depends_on:
      operator-web:
        condition: service_healthy
    restart: unless-stopped

  upstream-demo:
    profiles: ["upstream-demo"]
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8089:80"
    restart: "no"

volumes:
  photobooth_operator_data:

