# Container listener; Compose restricts the published host port to loopback.
Listen 0.0.0.0:8080

<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot /var/www/photobooth/custom/public

    SetEnv PHOTOBOOTH_LISTENER_MODE operator
    <IfModule php_module>
        php_admin_value upload_max_filesize 5M
        php_admin_value post_max_size 32M
    </IfModule>

    <Directory /var/www/photobooth/custom/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "same-origin"

    ErrorLog ${APACHE_LOG_DIR}/operator-error.log
    CustomLog ${APACHE_LOG_DIR}/operator-access.log combined
</VirtualHost>

